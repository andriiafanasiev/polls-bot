name: Post Telegram polls

on:
  schedule:
    # Every 30 min, 10:00–14:30 UTC = 12:00–16:30 Kyiv (winter, UTC+2).
    # Covers the 12:00 / 12:30 / 13:00 / 15:00 slots. ~10 runs/day.
    # In summer (UTC+3) shift to "*/30 9-13 * * *".
    - cron: '*/30 10-14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not post)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-polls
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate polls.json
        run: npm run check

      - name: Post due polls
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: npm run post

      - name: Save posted state
        if: always()
        run: |
          git config user.name "polls-bot"
          git config user.email "polls-bot@users.noreply.github.com"
          git add data/posted.json
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "chore: mark polls as posted"
            git pull --rebase
            git push
          fi
